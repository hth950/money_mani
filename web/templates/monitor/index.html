{% extends "base.html" %}
{% block title %}실시간 모니터 - Money Mani{% endblock %}
{% block content %}
<h1>실시간 모니터</h1>

<article>
    <header>모니터 제어</header>
    <div class="grid">
        <div>
            <label>시장 필터
                <select id="market-filter">
                    <option value="">전체</option>
                    <option value="KRX">한국 (KRX)</option>
                    <option value="US">미국 (US)</option>
                </select>
            </label>
        </div>
        <div>
            <p>상태: <strong id="monitor-status">확인 중...</strong></p>
            <p id="disabled-reason" role="alert" hidden></p>
            <button id="start-btn" onclick="startMonitor()" disabled>모니터 시작</button>
            <button id="stop-btn" onclick="stopMonitor()" disabled>모니터 중지</button>
        </div>
    </div>
</article>

<article>
    <header>실시간 신호 피드</header>
    <div id="signal-feed">
        <p>모니터를 시작하면 실시간 신호가 여기에 표시됩니다.</p>
    </div>
</article>

<script src="/static/safe_html.js"></script>
<script>
const { escapeHtml, escapeAttr } = window.MoneyManiSafe;

// Rendering helpers
function renderSignalItem(sig) {
    const cls = sig.signal_type === 'BUY' ? 'signal-buy' : 'signal-sell';
    const ticker = sig.ticker || '';
    return '<strong class="' + escapeAttr(cls) + '">' + escapeHtml(sig.signal_type || '') + '</strong> '
        + escapeHtml(sig.ticker_name || ticker) + ' (' + escapeHtml(ticker) + ') @ '
        + escapeHtml(Number(sig.price).toLocaleString()) + ' '
        + '<small>[' + escapeHtml(sig.strategy_name || '') + '] '
        + escapeHtml(sig.timestamp || sig.market || '') + '</small>';
}

// API data loading
let evtSource = null;

function checkStatus() {
    fetch('/api/monitor/status')
        .then(r => r.json())
        .then(data => {
            const status = document.getElementById('monitor-status');
            const disabledReason = document.getElementById('disabled-reason');
            const startBtn = document.getElementById('start-btn');
            const stopBtn = document.getElementById('stop-btn');
            const marketFilter = document.getElementById('market-filter');
            if (!data.enabled) {
                status.textContent = data.running ? '비활성화됨 (현재 실행 중)' : '비활성화됨';
                status.style.color = 'var(--pico-color-red-500, #b42318)';
                disabledReason.textContent = data.disabled_reason || '안전을 위해 시작이 차단되었습니다.';
                disabledReason.hidden = false;
                startBtn.disabled = true;
                stopBtn.disabled = !data.running;
                marketFilter.disabled = true;
                if (evtSource) { evtSource.close(); evtSource = null; }
            } else if (data.running) {
                status.textContent = '실행 중';
                status.style.color = 'var(--pico-color-green-500, green)';
                disabledReason.hidden = true;
                startBtn.disabled = true;
                stopBtn.disabled = false;
                marketFilter.disabled = false;
                if (!evtSource) connectSSE();
            } else {
                status.textContent = '중지됨';
                status.style.color = '';
                disabledReason.hidden = true;
                startBtn.disabled = false;
                stopBtn.disabled = true;
                marketFilter.disabled = false;
            }
        });
}

function startMonitor() {
    const filter = document.getElementById('market-filter').value;
    const params = filter ? '?market_filter=' + filter : '';
    fetch('/api/monitor/start' + params, {method: 'POST'})
        .then(r => r.json())
        .then(data => {
            checkStatus();
            if (data.enabled && data.status !== 'disabled') connectSSE();
        });
}

function stopMonitor() {
    fetch('/api/monitor/stop', {method: 'POST'})
        .then(r => r.json())
        .then(() => {
            checkStatus();
            if (evtSource) { evtSource.close(); evtSource = null; }
        });
}

function connectSSE() {
    if (evtSource) evtSource.close();
    evtSource = new EventSource('/api/monitor/stream');

    evtSource.addEventListener('signal', (e) => {
        const sig = JSON.parse(e.data);
        const feed = document.getElementById('signal-feed');
        const item = document.createElement('div');
        item.className = 'signal-item';
        item.innerHTML = renderSignalItem(sig);

        if (feed.querySelector('p')) feed.textContent = '';
        feed.insertBefore(item, feed.firstChild);
    });

    evtSource.addEventListener('connected', () => {
        console.log('SSE connected');
    });

    evtSource.onerror = () => {
        console.log('SSE connection error, retrying...');
    };
}

checkStatus();
</script>
{% endblock %}
